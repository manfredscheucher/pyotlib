[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyotlib2"
version = "2.0.0"
description = "Python Order Type Library — combinatorial geometry on abstract order types"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Manfred Scheucher" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
vis    = ["PySide6>=6.5", "matplotlib>=3.7"]   # interactive editor + static plots
sat    = ["python-sat"]                          # SAT-based OT extension (CaDiCaL)
scipy  = ["scipy>=1.10"]                        # nonlinear realization + beautify-coords
lp     = []                                     # GLPK via system package (glpsol binary)
all    = ["PySide6>=6.5", "matplotlib>=3.7", "python-sat", "scipy>=1.10"]
dev    = ["pytest", "pytest-cov", "pytest-timeout"]

[project.scripts]
pyotlib2 = "pyotlib2.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyotlib2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
